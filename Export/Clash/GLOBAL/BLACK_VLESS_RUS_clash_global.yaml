    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 150
    lazy: true
    timeout: 5000
    max-failed-times: 2
    expected-status: 204

  - name: "Igareck Manual (Ручное Подключение)"
    type: select
